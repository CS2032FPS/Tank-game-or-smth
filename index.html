<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Arena Game - Step 3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- CONSTANTS ---
        const MAP_WIDTH = 3000;
        const MAP_HEIGHT = 3000;
        const GRID_SIZE = 50;

        const STAT_NAMES = [
            'Health Regen', 'Max Health', 'Bullet Speed', 
            'Bullet Damage', 'Reload', 'Movement Speed'
        ];
        const STAT_COLORS = [
            '#e2ab69', '#e67ebf', '#6abcf1', 
            '#f14e54', '#85e37d', '#768dfc'
        ];

        // --- UTILITIES ---
        function drawHealthBar(ctx, x, y, hp, maxHp, yOffset) {
            if (hp >= maxHp) return;
            const width = 40;
            const height = 6;
            const barX = x - width / 2;
            const barY = y + yOffset;

            ctx.fillStyle = '#555';
            ctx.fillRect(barX, barY, width, height);
            
            const healthWidth = Math.max(0, width * (hp / maxHp));
            ctx.fillStyle = '#85e37d';
            ctx.fillRect(barX, barY, healthWidth, height);
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, width, height);
        }

        // --- CLASSES ---
        class Bullet {
            constructor(x, y, angle, owner) {
                this.x = x;
                this.y = y;
                this.owner = owner;
                
                // Inherit stats from owner
                this.speed = owner.bSpeed || 10;
                this.damage = owner.bDamage || 10;
                
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.radius = 8;
                this.life = 100;
                this.markedForDeletion = false;
                
                this.team = owner.team;
                this.color = owner.color;
                this.hp = this.damage; 
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                if (this.life <= 0 || this.x < 0 || this.x > MAP_WIDTH || this.y < 0 || this.y > MAP_HEIGHT) {
                    this.markedForDeletion = true;
                }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        class Shape {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; 
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.02;
                this.markedForDeletion = false;
                this.team = 'neutral';
                
                if (this.type === 'square') {
                    this.radius = 15; this.color = '#ffe869'; this.sides = 4;
                    this.maxHp = 10; this.xpValue = 10;
                } else if (this.type === 'triangle') {
                    this.radius = 18; this.color = '#fc7677'; this.sides = 3;
                    this.maxHp = 30; this.xpValue = 25;
                } else if (this.type === 'pentagon') {
                    this.radius = 25; this.color = '#768dfc'; this.sides = 5;
                    this.maxHp = 100; this.xpValue = 130;
                }
                this.hp = this.maxHp;
            }

            update() {
                this.angle += this.spin;
                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.beginPath();
                for (let i = 0; i < this.sides; i++) {
                    const angle = (i * 2 * Math.PI) / this.sides;
                    ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(angle) * this.radius, Math.sin(angle) * this.radius);
                }
                ctx.closePath();
                
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();

                drawHealthBar(ctx, this.x, this.y, this.hp, this.maxHp, -this.radius - 15);
            }
        }

        class Tank {
            constructor(x, y, team) {
                this.x = x;
                this.y = y;
                this.team = team;
                this.color = team === 'blue' ? '#00b2e1' : '#f14e54';
                this.radius = 20;
                this.angle = 0;
                this.barrelLength = 35;
                this.barrelWidth = 18;
                
                this.shootCooldown = 0;
                this.markedForDeletion = false;

                // Leveling & Stats
                this.level = 1;
                this.xp = 0;
                this.nextLevelXp = 50;
                this.skillPoints = 0;
                this.statLevels = [0, 0, 0, 0, 0, 0]; // Regen, MaxHP, B.Speed, B.Dmg, Reload, M.Speed
                this.maxStatLevel = 7;

                this.hp = this.maxHp;
            }

            // Stat Getters dynamically calculate based on upgrade levels
            get hpRegen() { return 0.02 + (this.statLevels[0] * 0.02); }
            get maxHp() { return 100 + (this.statLevels[1] * 20); }
            get bSpeed() { return 8 + (this.statLevels[2] * 1.5); }
            get bDamage() { return 10 + (this.statLevels[3] * 4); }
            get reloadTime() { return Math.max(5, 30 - (this.statLevels[4] * 3)); }
            get moveSpeed() { return 3 + (this.statLevels[5] * 0.4); }

            addXp(amount) {
                this.xp += amount;
                while (this.xp >= this.nextLevelXp) {
                    this.xp -= this.nextLevelXp;
                    this.level++;
                    this.skillPoints++;
                    this.nextLevelXp = Math.floor(this.nextLevelXp * 1.2);
                    this.hp = this.maxHp; // Heal on level up
                }
            }

            upgradeStat(index) {
                if (this.skillPoints > 0 && this.statLevels[index] < this.maxStatLevel) {
                    this.statLevels[index]++;
                    this.skillPoints--;
                    if (index === 1) this.hp += 20; // instantly give the new HP capacity
                }
            }

            shoot(game) {
                if (this.shootCooldown <= 0) {
                    const tipX = this.x + Math.cos(this.angle) * this.barrelLength;
                    const tipY = this.y + Math.sin(this.angle) * this.barrelLength;
                    game.bullets.push(new Bullet(tipX, tipY, this.angle, this));
                    this.shootCooldown = this.reloadTime;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Barrel
                ctx.rotate(this.angle);
                ctx.fillStyle = '#999';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.fillRect(0, -this.barrelWidth / 2, this.barrelLength, this.barrelWidth);
                ctx.strokeRect(0, -this.barrelWidth / 2, this.barrelLength, this.barrelWidth);
                ctx.rotate(-this.angle); 

                // Body
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.restore();
                drawHealthBar(ctx, this.x, this.y, this.hp, this.maxHp, this.radius + 15);
            }
        }

        class Player extends Tank {
            constructor(x, y) {
                super(x, y, 'blue');
            }

            update(keys, mouseWorldPos, game) {
                let dx = 0, dy = 0;
                if (keys['KeyW']) dy -= 1;
                if (keys['KeyS']) dy += 1;
                if (keys['KeyA']) dx -= 1;
                if (keys['KeyD']) dx += 1;

                if (dx !== 0 && dy !== 0) {
                    const length = Math.hypot(dx, dy);
                    dx /= length; dy /= length;
                }

                this.x += dx * this.moveSpeed;
                this.y += dy * this.moveSpeed;

                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));

                this.angle = Math.atan2(mouseWorldPos.y - this.y, mouseWorldPos.x - this.x);

                if (this.shootCooldown > 0) this.shootCooldown--;
                if (game.isShooting) this.shoot(game);

                if (this.hp < this.maxHp) {
                    this.hp = Math.min(this.maxHp, this.hp + this.hpRegen);
                }
            }
        }

        class EnemyTank extends Tank {
            constructor(x, y, team) {
                super(x, y, team);
                this.wanderTimer = 0;
                this.target = null;
                
                // Randomize base level for enemies
                const bonusLevels = Math.floor(Math.random() * 5);
                for(let i=0; i<bonusLevels; i++) {
                    this.statLevels[Math.floor(Math.random() * 6)]++;
                }
                this.hp = this.maxHp;
                this.xpValue = 250 + (bonusLevels * 50);
            }

            findTarget(game) {
                let closestDist = 800; // Aggro radius
                this.target = null;

                const checkEntities = (entities) => {
                    for (let e of entities) {
                        if (e.team === this.team || e.markedForDeletion) continue;
                        const dist = Math.hypot(e.x - this.x, e.y - this.y);
                        if (dist < closestDist) {
                            closestDist = dist;
                            this.target = e;
                        }
                    }
                };

                checkEntities(game.enemies);
                checkEntities(game.shapes);
                if (game.player && game.player.team !== this.team) checkEntities([game.player]);
            }

            update(game) {
                this.findTarget(game);

                let currentSpeed = this.moveSpeed;

                if (this.target) {
                    const dx = this.target.x - this.x;
                    const dy = this.target.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    
                    this.angle = Math.atan2(dy, dx);
                    
                    if (dist < 300) currentSpeed = -currentSpeed * 0.5; // Back away if too close
                    else if (dist < 450) currentSpeed = 0; // Stop and shoot

                    this.shoot(game);
                } else {
                    this.wanderTimer--;
                    if (this.wanderTimer <= 0) {
                        this.angle = Math.random() * Math.PI * 2;
                        this.wanderTimer = 60 + Math.random() * 120;
                    }
                }

                if (this.shootCooldown > 0) this.shootCooldown--;
                
                if (this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.hpRegen);

                this.x += Math.cos(this.angle) * currentSpeed;
                this.y += Math.sin(this.angle) * currentSpeed;

                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.keys = {};
                this.mouseX = 0;
                this.mouseY = 0;
                this.isShooting = false;
                this.camera = { x: 0, y: 0 };
                this.state = 'PLAYING';

                this.setupInputs();
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                this.reset();
                requestAnimationFrame(() => this.loop());
            }

            reset() {
                this.player = new Player(MAP_WIDTH / 2, MAP_HEIGHT / 2);
                this.bullets = [];
                this.shapes = [];
                this.enemies = [];
                this.state = 'PLAYING';
                
                this.spawnInitialEntities();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            setupInputs() {
                window.addEventListener('keydown', e => {
                    this.keys[e.code] = true;
                    // Upgrade keys 1-6
                    if (this.state === 'PLAYING' && this.player.skillPoints > 0) {
                        const keyNum = parseInt(e.key);
                        if (keyNum >= 1 && keyNum <= 6) {
                            this.player.upgradeStat(keyNum - 1);
                        }
                    }
                });
                window.addEventListener('keyup', e => this.keys[e.code] = false);
                
                window.addEventListener('mousemove', e => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });
                
                window.addEventListener('mousedown', e => {
                    if (e.button === 0) {
                        if (this.state === 'GAMEOVER') this.reset();
                        else this.isShooting = true;
                    }
                });
                window.addEventListener('mouseup', e => {
                    if (e.button === 0) this.isShooting = false;
                });
            }

            spawnInitialEntities() {
                const types = ['square', 'triangle', 'pentagon'];
                for (let i = 0; i < 150; i++) {
                    this.shapes.push(new Shape(Math.random() * MAP_WIDTH, Math.random() * MAP_HEIGHT, types[Math.floor(Math.random() * types.length)]));
                }
                for (let i = 0; i < 15; i++) {
                    const team = Math.random() > 0.5 ? 'red' : 'blue';
                    this.enemies.push(new EnemyTank(Math.random() * MAP_WIDTH, Math.random() * MAP_HEIGHT, team));
                }
            }

            getMouseWorldPos() {
                return { x: this.mouseX + this.camera.x, y: this.mouseY + this.camera.y };
            }

            handlePhysicalCollision(e1, e2, damageRatio) {
                const dx = e1.x - e2.x;
                const dy = e1.y - e2.y;
                const dist = Math.hypot(dx, dy);
                const minDist = e1.radius + e2.radius;

                if (dist < minDist) {
                    if (e1.team !== e2.team) {
                        e1.hp -= damageRatio;
                        e2.hp -= damageRatio;
                        
                        // Handle kill XP for body ramming
                        if (e1.hp <= 0 && e2.addXp && e1.xpValue) e2.addXp(e1.xpValue);
                        if (e2.hp <= 0 && e1.addXp && e2.xpValue) e1.addXp(e2.xpValue);
                    }

                    if (e1.hp <= 0) e1.markedForDeletion = true;
                    if (e2.hp <= 0) e2.markedForDeletion = true;

                    if (dist > 0) {
                        const overlap = minDist - dist;
                        const pushX = (dx / dist) * overlap * 0.5;
                        const pushY = (dy / dist) * overlap * 0.5;
                        e1.x += pushX; e1.y += pushY;
                        e2.x -= pushX; e2.y -= pushY;
                    }
                }
            }

            checkCollisions() {
                const allEntities = [this.player, ...this.enemies, ...this.shapes].filter(e => e && !e.markedForDeletion);
                
                // Bullets vs Entities
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    for (let j = 0; j < allEntities.length; j++) {
                        const e = allEntities[j];
                        if (b.team === e.team) continue; // No friendly fire

                        if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                            const dmg = Math.min(b.hp, e.hp);
                            e.hp -= b.damage;
                            b.hp -= dmg;
                            
                            if (e.hp <= 0) {
                                e.markedForDeletion = true;
                                if (b.owner && b.owner.addXp && e.xpValue) b.owner.addXp(e.xpValue);
                            }
                            if (b.hp <= 0) {
                                b.markedForDeletion = true;
                                break;
                            }
                        }
                    }
                }

                // Physical Collisions
                for (let i = 0; i < allEntities.length; i++) {
                    for (let j = i + 1; j < allEntities.length; j++) {
                        this.handlePhysicalCollision(allEntities[i], allEntities[j], 1);
                    }
                }
            }

            update() {
                if (this.state === 'GAMEOVER') return;

                this.player.update(this.keys, this.getMouseWorldPos(), this);
                if (this.player.hp <= 0) this.state = 'GAMEOVER';

                this.camera.x = Math.max(0, Math.min(MAP_WIDTH - this.canvas.width, this.player.x - this.canvas.width / 2));
                this.camera.y = Math.max(0, Math.min(MAP_HEIGHT - this.canvas.height, this.player.y - this.canvas.height / 2));

                this.bullets.forEach(b => b.update());
                this.shapes.forEach(s => s.update());
                this.enemies.forEach(e => e.update(this));

                this.checkCollisions();

                this.bullets = this.bullets.filter(b => !b.markedForDeletion);
                this.shapes = this.shapes.filter(s => !s.markedForDeletion);
                this.enemies = this.enemies.filter(e => !e.markedForDeletion);

                // Respawning
                if (this.shapes.length < 100) {
                    const types = ['square', 'triangle', 'pentagon'];
                    this.shapes.push(new Shape(Math.random() * MAP_WIDTH, Math.random() * MAP_HEIGHT, types[Math.floor(Math.random() * types.length)]));
                }
                if (this.enemies.length < 12) {
                    const team = Math.random() > 0.5 ? 'red' : 'blue';
                    this.enemies.push(new EnemyTank(Math.random() * MAP_WIDTH, Math.random() * MAP_HEIGHT, team));
                }
            }

            drawUI() {
                // XP Bar
                const barWidth = this.canvas.width * 0.5;
                const barHeight = 20;
                const barX = (this.canvas.width - barWidth) / 2;
                const barY = this.canvas.height - 30;
                
                this.ctx.fillStyle = '#555';
                this.ctx.fillRect(barX, barY, barWidth, barHeight);
                this.ctx.fillStyle = '#ffd700'; // Gold XP
                this.ctx.fillRect(barX, barY, barWidth * (this.player.xp / this.player.nextLevelXp), barHeight);
                this.ctx.strokeStyle = '#333';
                this.ctx.strokeRect(barX, barY, barWidth, barHeight);

                this.ctx.fillStyle = '#fff';
                this.ctx.font = 'bold 14px sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(`Level ${this.player.level}`, this.canvas.width / 2, barY + 15);

                // Upgrades Panel
                const startX = 20;
                let startY = this.canvas.height - 250;
                
                if (this.player.skillPoints > 0) {
                    this.ctx.textAlign = 'left';
                    this.ctx.fillStyle = '#333';
                    this.ctx.font = 'bold 18px sans-serif';
                    this.ctx.fillText(`x${this.player.skillPoints} Upgrades Available!`, startX, startY - 15);
                }

                for (let i = 0; i < 6; i++) {
                    const level = this.player.statLevels[i];
                    const y = startY + (i * 35);
                    
                    // Stat text & keybind
                    this.ctx.textAlign = 'left';
                    this.ctx.font = 'bold 14px sans-serif';
                    this.ctx.fillStyle = this.player.skillPoints > 0 && level < this.player.maxStatLevel ? '#333' : '#888';
                    this.ctx.fillText(`[${i + 1}] ${STAT_NAMES[i]}`, startX, y + 16);
                    
                    // Upgrade pips
                    for (let p = 0; p < this.player.maxStatLevel; p++) {
                        this.ctx.fillStyle = p < level ? STAT_COLORS[i] : '#ccc';
                        this.ctx.fillRect(startX + 140 + (p * 15), y + 5, 12, 14);
                        this.ctx.strokeStyle = '#555';
                        this.ctx.strokeRect(startX + 140 + (p * 15), y + 5, 12, 14);
                    }
                }
            }

            drawGrid() {
                this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                const startX = Math.floor(this.camera.x / GRID_SIZE) * GRID_SIZE;
                const startY = Math.floor(this.camera.y / GRID_SIZE) * GRID_SIZE;
                for (let x = startX; x <= startX + this.canvas.width + GRID_SIZE; x += GRID_SIZE) {
                    this.ctx.moveTo(x, this.camera.y); this.ctx.lineTo(x, this.camera.y + this.canvas.height);
                }
                for (let y = startY; y <= startY + this.canvas.height + GRID_SIZE; y += GRID_SIZE) {
                    this.ctx.moveTo(this.camera.x, y); this.ctx.lineTo(this.camera.x + this.canvas.width, y);
                }
                this.ctx.stroke();
            }

            draw() {
                this.ctx.fillStyle = '#cdcdcd';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.save();
                this.ctx.translate(-this.camera.x, -this.camera.y);

                this.drawGrid();
                this.ctx.strokeStyle = '#333';
                this.ctx.lineWidth = 5;
                this.ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

                this.shapes.forEach(s => s.draw(this.ctx));
                this.enemies.forEach(e => e.draw(this.ctx));
                this.bullets.forEach(b => b.draw(this.ctx));
                
                if (this.state === 'PLAYING') this.player.draw(this.ctx);

                this.ctx.restore();

                if (this.state === 'PLAYING') {
                    this.drawUI();
                } else if (this.state === 'GAMEOVER') {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.fillStyle = '#fff';
                    this.ctx.textAlign = 'center';
                    this.ctx.font = 'bold 60px sans-serif';
                    this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2 - 20);
                    this.ctx.font = '24px sans-serif';
                    this.ctx.fillText(`You reached Level ${this.player.level}`, this.canvas.width / 2, this.canvas.height / 2 + 20);
                    this.ctx.fillText('Click anywhere to restart', this.canvas.width / 2, this.canvas.height / 2 + 60);
                }
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        window.onload = () => new Game();
    </script>
</body>
</html>
