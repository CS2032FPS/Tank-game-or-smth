<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Arena Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- CONSTANTS ---
        const MAP_WIDTH = 3000;
        const MAP_HEIGHT = 3000;
        const GRID_SIZE = 50;

        // --- CLASSES ---

        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.speed = 8;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.radius = 8;
                this.life = 100; // Lifespan (frames)
                this.markedForDeletion = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                if (this.life <= 0 || 
                    this.x < 0 || this.x > MAP_WIDTH || 
                    this.y < 0 || this.y > MAP_HEIGHT) {
                    this.markedForDeletion = true;
                }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f14e54';
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        class Shape {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'square', 'triangle', 'pentagon'
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.02;
                this.markedForDeletion = false;
                
                // Assign properties based on type
                if (this.type === 'square') {
                    this.radius = 15;
                    this.color = '#ffe869';
                    this.sides = 4;
                } else if (this.type === 'triangle') {
                    this.radius = 18;
                    this.color = '#fc7677';
                    this.sides = 3;
                } else if (this.type === 'pentagon') {
                    this.radius = 25;
                    this.color = '#768dfc';
                    this.sides = 5;
                }
            }

            update() {
                this.angle += this.spin;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.beginPath();
                for (let i = 0; i < this.sides; i++) {
                    const angle = (i * 2 * Math.PI) / this.sides;
                    const px = Math.cos(angle) * this.radius;
                    const py = Math.sin(angle) * this.radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.restore();
            }
        }

        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 20;
                this.speed = 4;
                this.angle = 0;
                this.barrelLength = 35;
                this.barrelWidth = 18;
                
                this.shootCooldown = 0;
                this.shootDelay = 15; // frames between shots
            }

            update(keys, mouseWorldPos, game) {
                // Movement
                let dx = 0;
                let dy = 0;
                if (keys['KeyW']) dy -= 1;
                if (keys['KeyS']) dy += 1;
                if (keys['KeyA']) dx -= 1;
                if (keys['KeyD']) dx += 1;

                // Normalize diagonal movement
                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length;
                    dy /= length;
                }

                this.x += dx * this.speed;
                this.y += dy * this.speed;

                // Clamp to arena bounds
                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));

                // Aiming
                this.angle = Math.atan2(mouseWorldPos.y - this.y, mouseWorldPos.x - this.x);

                // Shooting
                if (this.shootCooldown > 0) this.shootCooldown--;
                if (game.isShooting && this.shootCooldown === 0) {
                    this.shoot(game);
                    this.shootCooldown = this.shootDelay;
                }
            }

            shoot(game) {
                // Spawn bullet at the tip of the barrel
                const tipX = this.x + Math.cos(this.angle) * this.barrelLength;
                const tipY = this.y + Math.sin(this.angle) * this.barrelLength;
                game.bullets.push(new Bullet(tipX, tipY, this.angle));
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Draw Barrel (rotates independently to point at mouse)
                ctx.rotate(this.angle);
                ctx.fillStyle = '#999';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                // Offset rect so it starts inside the player and extends outwards
                ctx.fillRect(0, -this.barrelWidth / 2, this.barrelLength, this.barrelWidth);
                ctx.strokeRect(0, -this.barrelWidth / 2, this.barrelLength, this.barrelWidth);
                
                ctx.rotate(-this.angle); // Un-rotate for the body

                // Draw Body
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00b2e1';
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.restore();
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.keys = {};
                this.mouseX = 0;
                this.mouseY = 0;
                this.isShooting = false;
                
                this.player = new Player(MAP_WIDTH / 2, MAP_HEIGHT / 2);
                this.bullets = [];
                this.shapes = [];

                this.camera = { x: 0, y: 0 };

                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                this.setupInputs();
                this.spawnInitialShapes();

                // Start game loop
                requestAnimationFrame(() => this.loop());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            setupInputs() {
                window.addEventListener('keydown', e => this.keys[e.code] = true);
                window.addEventListener('keyup', e => this.keys[e.code] = false);
                
                window.addEventListener('mousemove', e => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });
                
                window.addEventListener('mousedown', e => {
                    if(e.button === 0) this.isShooting = true;
                });
                window.addEventListener('mouseup', e => {
                    if(e.button === 0) this.isShooting = false;
                });
            }

            spawnInitialShapes() {
                const types = ['square', 'triangle', 'pentagon'];
                for (let i = 0; i < 150; i++) {
                    const x = Math.random() * MAP_WIDTH;
                    const y = Math.random() * MAP_HEIGHT;
                    const type = types[Math.floor(Math.random() * types.length)];
                    this.shapes.push(new Shape(x, y, type));
                }
            }

            getMouseWorldPos() {
                return {
                    x: this.mouseX + this.camera.x,
                    y: this.mouseY + this.camera.y
                };
            }

            checkCollisions() {
                // Basic Circle Collision Detection between Bullets and Shapes
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    for (let j = this.shapes.length - 1; j >= 0; j--) {
                        const s = this.shapes[j];
                        
                        const dx = b.x - s.x;
                        const dy = b.y - s.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < b.radius + s.radius) {
                            b.markedForDeletion = true;
                            s.markedForDeletion = true; // One-hit destroy for now
                            break; // Stop checking this bullet against other shapes
                        }
                    }
                }
            }

            update() {
                // Update player
                this.player.update(this.keys, this.getMouseWorldPos(), this);

                // Update Camera to follow player
                this.camera.x = this.player.x - this.canvas.width / 2;
                this.camera.y = this.player.y - this.canvas.height / 2;

                // Clamp camera to map boundaries
                this.camera.x = Math.max(0, Math.min(MAP_WIDTH - this.canvas.width, this.camera.x));
                this.camera.y = Math.max(0, Math.min(MAP_HEIGHT - this.canvas.height, this.camera.y));

                // Update entities
                this.bullets.forEach(b => b.update());
                this.shapes.forEach(s => s.update());

                // Collisions
                this.checkCollisions();

                // Cleanup deleted entities
                this.bullets = this.bullets.filter(b => !b.markedForDeletion);
                this.shapes = this.shapes.filter(s => !s.markedForDeletion);

                // Respawn shapes if they run low
                if (this.shapes.length < 100) {
                    const types = ['square', 'triangle', 'pentagon'];
                    const x = Math.random() * MAP_WIDTH;
                    const y = Math.random() * MAP_HEIGHT;
                    const type = types[Math.floor(Math.random() * types.length)];
                    this.shapes.push(new Shape(x, y, type));
                }
            }

            drawGrid() {
                this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                
                // Calculate visible grid area
                const startX = Math.floor(this.camera.x / GRID_SIZE) * GRID_SIZE;
                const startY = Math.floor(this.camera.y / GRID_SIZE) * GRID_SIZE;
                const endX = startX + this.canvas.width + GRID_SIZE;
                const endY = startY + this.canvas.height + GRID_SIZE;

                for (let x = startX; x <= endX; x += GRID_SIZE) {
                    this.ctx.moveTo(x, this.camera.y);
                    this.ctx.lineTo(x, this.camera.y + this.canvas.height);
                }
                for (let y = startY; y <= endY; y += GRID_SIZE) {
                    this.ctx.moveTo(this.camera.x, y);
                    this.ctx.lineTo(this.camera.x + this.canvas.width, y);
                }
                
                this.ctx.stroke();
            }

            drawBounds() {
                this.ctx.strokeStyle = '#333';
                this.ctx.lineWidth = 5;
                this.ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
            }

            draw() {
                // Clear screen
                this.ctx.fillStyle = '#cdcdcd';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.save();
                // Apply Camera Translation
                this.ctx.translate(-this.camera.x, -this.camera.y);

                // Draw Environment
                this.drawGrid();
                this.drawBounds();

                // Draw Entities
                this.shapes.forEach(s => s.draw(this.ctx));
                this.bullets.forEach(b => b.draw(this.ctx));
                this.player.draw(this.ctx);

                this.ctx.restore();
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        // Start the game when the window loads
        window.onload = () => {
            new Game();
        };

    </script>
</body>
</html>
