<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Arena - Final Evolution</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #0b0b1a; font-family: sans-serif; user-select: none; color: white;}
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer"></div>

    <script>
        // --- CONSTANTS & CONFIG ---
        const MAP_WIDTH = 8000, MAP_HEIGHT = 8000, GRID_SIZE = 50;

        // Exponential Scaling for God-Tiers
        const EVOLUTION_LEVELS = [0, 15, 30, 45, 60, 75, 90, 105, 120, 135, 200, 300, 450, 650, 900, 1200, 1600, 2100, 2700, 3500];
        const STAT_NAMES = ['Health Regen', 'Max Health', 'Bullet Speed', 'Bullet Damage', 'Reload', 'Movement Speed'];
        const STAT_COLORS = ['#e2ab69', '#e67ebf', '#6abcf1', '#f14e54', '#85e37d', '#768dfc'];

        const makeBarrels = (c, l, w, off=0) => Array.from({length: c}, (_, i) => ({l, w, a: (360/c)*i + off}));

        // --- TANK EVOLUTION TREE (Tiers 1 - 20) ---
        const TANK_CLASSES = {
            'Base': { tier: 1, b: [{l:35, w:18}] },
            'Twin': { tier: 2, b: [{l:35, w:18, y:-10}, {l:35, w:18, y:10}] },
            'Sniper': { tier: 2, fov: 1.25, b: [{l:45, w:18, r:1.5, d:1.5, s:1.5}] },
            'Machine Gun': { tier: 2, b: [{l:35, w:22, spr:0.3, r:0.5}] },
            'Quad': { tier: 3, b: makeBarrels(4, 35, 18) },
            'Assassin': { tier: 3, fov: 1.5, b: [{l:50, w:18, r:2, d:2, s:2}] },
            'Destroyer': { tier: 3, b: [{l:30, w:30, r:3, d:4, s:0.8, type:'heavy', rec:15}] },
            'Octo': { tier: 4, b: makeBarrels(8, 35, 18) },
            'Ranger': { tier: 4, fov: 1.8, b: [{l:55, w:18, r:2.5, d:3, s:2.5}] },
            'Annihilator': { tier: 4, b: [{l:30, w:40, r:3.5, d:6, s:0.8, type:'heavy', rec:25}] },
            'Pentashot': { tier: 5, b: [{l:35,w:16},{l:30,w:16,a:20},{l:30,w:16,a:-20},{l:25,w:16,a:40},{l:25,w:16,a:-40}] },
            'Stalker': { tier: 5, invis: true, fov: 1.5, b: [{l:50, w:18, r:2, d:2, s:2}] },
            'Skimmer': { tier: 5, b: [{l:35, w:20, type:'skimmer', r:2}] },
            'Fighter': { tier: 6, b: [{l:35,w:18},{l:25,w:16,a:90},{l:25,w:16,a:-90},{l:25,w:16,a:150,rec:5},{l:25,w:16,a:-150,rec:5}] },
            'Overlord': { tier: 6, b: [{l:25, w:30, type:'drone', max: 8}], fov: 1.2 },
            'Necromancer': { tier: 6, b: [{l:25, w:30, type:'square_drone', max: 15}] },
            'Battleship': { tier: 7, b: [{l:20, w:10, a:90, type:'micro', r:0.2}, {l:20, w:10, a:-90, type:'micro', r:0.2}] },
            'Factory': { tier: 7, b: [{l:25, w:30, type:'minion', r:3, max: 4}] },
            'Auto-Gunner': { tier: 7, autoTurrets: 1, b: [{l:35,w:15,y:-5},{l:35,w:15,y:5},{l:35,w:15,y:0,a:180}] },
            'Artillery': { tier: 8, b: [{l:40, w:20, type:'artillery', r:2, d:2}] },
            'Laser Cannon': { tier: 8, b: [{l:35, w:15, type:'laser', r:0.1, d:0.2}] },
            'Tesla Coil': { tier: 8, tesla: true, b: [] },
            'Plasma Emitter': { tier: 9, b: [{l:35, w:25, type:'plasma', s:0.5, d:0.5, r:0.5}] },
            'Railgun': { tier: 9, fov: 1.6, b: [{l:60, w:12, type:'railgun', r:5, d:10, s:4, rec:20}] },
            'Orbiting Swarm': { tier: 9, swarm: true, b: [{l:35, w:18}] },
            'Mothership': { tier: 10, fov: 1.5, maxHpMult: 3, b: [{l:25, w:30, type:'drone', max: 30}] },
            'Dreadnought': { tier: 10, autoTurrets: 6, maxHpMult: 5, b: [{l:40, w:25, type:'heavy'}] },
            // --- GOD TIERS ---
            'Antimatter Caster': { tier: 11, b: [{l:45, w:20, type:'antimatter', r:1.5, s:0.5}] },
            'Singularity Engine': { tier: 12, b: [{l:30, w:35, type:'blackhole', r:10}] },
            'Chrono-Tank': { tier: 13, fov: 1.3, aura: 'chrono', b: [{l:40, w:20, d:2}] },
            'Dimensional Rift': { tier: 14, ability: 'teleport', fov: 1.4, b: [{l:40, w:15, r:0.5}] },
            'Star-Eater': { tier: 15, aura: 'drain', maxHpMult: 4, b: [{l:35, w:22, type:'plasma', d:2}] },
            'Supernova': { tier: 16, passive: 'supernova', b: [{l:45, w:25, r:1.5, d:3, type:'heavy'}] },
            'Nebula Weaver': { tier: 17, passive: 'trail', moveSpeedMult: 1.5, b: [{l:35, w:18, type:'heavy'}] },
            'Quasar': { tier: 18, passive: 'quasar', fov: 1.5, b: [{l:50, w:15, type:'laser', r:0.05, d:0.3}, {l:50, w:15, type:'laser', r:0.05, d:0.3, a:180}] },
            'The Monolith': { tier: 19, fov: 2.5, speedMult: 0, maxHpMult: 25, b: [{l:60, w:40, type:'seeker', r:3, d:5}] },
            'Cosmic Overseer': { tier: 20, fov: 5, ability: 'orbital', maxHpMult: 50, speedMult: 0.2, b: [] }
        };

        const getTierClasses = (t) => Object.keys(TANK_CLASSES).filter(k => TANK_CLASSES[k].tier === t);
        const randItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

        // --- UTILITIES ---
        function drawHealthBar(ctx, x, y, hp, maxHp, yOffset, w=40) {
            if (hp >= maxHp || hp <= 0) return;
            const h = 6, bx = x - w/2, by = y + yOffset;
            ctx.fillStyle = '#555'; ctx.fillRect(bx, by, w, h);
            ctx.fillStyle = '#85e37d'; ctx.fillRect(bx, by, Math.max(0, w * (hp / maxHp)), h);
            ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, w, h);
        }

        // --- ENTITIES ---
        class Bullet {
            constructor(x, y, angle, owner, config) {
                this.x = x; this.y = y; this.owner = owner; this.team = owner.team; this.color = owner.color;
                this.type = config.type || 'basic';
                this.speed = (owner.bSpeed || 10) * (config.s || 1);
                this.damage = (owner.bDamage || 10) * (config.d || 1);
                this.vx = Math.cos(angle) * this.speed; this.vy = Math.sin(angle) * this.speed;
                this.radius = ['heavy','blackhole','supernova_blast','shockwave'].includes(this.type) ? 16 : this.type==='micro'?4 : 8;
                this.life = ['plasma','blackhole'].includes(this.type) ? 300 : this.type==='laser' ? 5 : this.type==='orbital' ? 120 : this.type==='toxic_trail'? 200 : 100;
                this.hp = ['plasma','railgun','blackhole','supernova_blast','shockwave','orbital','toxic_trail'].includes(this.type) ? 999999 : this.damage; 
                this.markedForDeletion = false; this.angle = angle;
                
                if (this.type === 'blackhole') { this.vx = 0; this.vy = 0; this.radius = 40; }
                if (this.type === 'orbital') { this.vx = 0; this.vy = 0; this.radius = 150; }
                if (this.type === 'toxic_trail') { this.vx = 0; this.vy = 0; this.radius = 35; }

                if (this.type.includes('drone') || this.type === 'minion' || this.type === 'seeker') {
                    this.life = 9999; this.hp = this.damage * 3;
                }
            }

            update(game) {
                // Tracking AI logic
                if (this.type.includes('drone') || this.type === 'minion' || this.type === 'seeker') {
                    let target = null;
                    if (this.type === 'seeker') {
                        // Map-wide seeking for Monolith
                        let closest = 99999;
                        [...game.enemies, game.player].forEach(e => {
                            if (e && e.team !== this.team) {
                                let d = Math.hypot(e.x-this.x, e.y-this.y);
                                if(d < closest) { closest = d; target = e; }
                            }
                        });
                    } else {
                        if (this.owner instanceof Player) target = game.getMouseWorldPos();
                        else if (this.owner.target) target = {x: this.owner.target.x, y: this.owner.target.y};
                    }

                    if (target) {
                        const desiredAngle = Math.atan2(target.y - this.y, target.x - this.x);
                        this.vx += Math.cos(desiredAngle) * 0.8; this.vy += Math.sin(desiredAngle) * 0.8;
                    }
                    this.vx *= 0.95; this.vy *= 0.95; // Friction
                    if(this.owner.markedForDeletion && this.type !== 'seeker') this.hp -= 0.5;
                }

                // Gravity effects (Antimatter)
                if (this.type === 'antimatter') {
                    [...game.enemies, ...game.shapes, game.player].forEach(e => {
                        if (e && e.team !== this.team && !e.markedForDeletion) {
                            const dx = this.x - e.x, dy = this.y - e.y, dist = Math.hypot(dx,dy);
                            if (dist < 250 && dist > 10) { e.x += (dx/dist)*3; e.y += (dy/dist)*3; }
                        }
                    });
                }
                
                // Blackhole & AOEs
                if (this.type === 'blackhole') {
                    this.radius = 40 + Math.sin(this.life*0.1)*5;
                    [...game.enemies, ...game.shapes, game.player].forEach(e => {
                        if (e && e.team !== this.team && !e.markedForDeletion) {
                            const dx = this.x - e.x, dy = this.y - e.y, dist = Math.hypot(dx,dy);
                            if (dist < 400 && dist > 10) { e.x += (dx/dist)*6; e.y += (dy/dist)*6; }
                            if (dist < this.radius) e.hp -= this.damage * 0.2; // Constant crush dmg
                        }
                    });
                }

                if (this.type === 'supernova_blast' || this.type === 'shockwave') {
                    this.radius += this.type === 'supernova_blast' ? 40 : 15;
                    this.life -= 2; // Dies fast
                }

                if (this.type === 'skimmer' && this.life % 10 === 0) {
                    game.bullets.push(new Bullet(this.x, this.y, this.angle + (this.life*0.2), this.owner, {type:'basic', s:0.5, d:0.5}));
                }

                // Apply time dilation if slowed
                let speedMult = this.slowed ? 0.1 : 1;
                this.x += this.vx * speedMult; this.y += this.vy * speedMult;
                this.slowed = false; // Reset every frame
                this.life--;

                if (this.life <= 0 || this.x < 0 || this.x > MAP_WIDTH || this.y < 0 || this.y > MAP_HEIGHT) {
                    if (this.type === 'artillery') {
                        for(let i=0; i<6; i++) game.bullets.push(new Bullet(this.x, this.y, (Math.PI*2/6)*i, this.owner, {type:'basic', s:0.5, d:0.5}));
                    }
                    this.markedForDeletion = true;
                }
            }

            draw(ctx) {
                ctx.beginPath();
                if(this.type === 'square_drone' || this.type === 'minion') {
                    ctx.rect(this.x - this.radius, this.y - this.radius, this.radius*2, this.radius*2);
                } else if (this.type === 'laser' || this.type === 'railgun') {
                    ctx.moveTo(this.x, this.y); ctx.lineTo(this.x - this.vx*2, this.y - this.vy*2);
                    ctx.lineWidth = this.type === 'railgun' ? 8 : 3;
                    ctx.strokeStyle = this.color; ctx.stroke(); return;
                } else if (this.type === 'orbital') {
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    if (this.life > 40) { // Warning phase
                        ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)'; ctx.lineWidth = 5; ctx.stroke(); return;
                    } else { // Strike phase
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fill(); return;
                    }
                } else if (this.type === 'supernova_blast' || this.type === 'shockwave') {
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.type === 'shockwave' ? 'rgba(100, 150, 255, 0.4)' : 'rgba(255, 100, 50, 0.6)'; 
                    ctx.fill(); return;
                } else if (this.type === 'toxic_trail') {
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(150, 50, 200, ${this.life/400})`; ctx.fill(); return;
                } else if (this.type === 'blackhole') {
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                    ctx.fillStyle = 'black'; ctx.fill();
                    ctx.strokeStyle = 'purple'; ctx.lineWidth = 4; ctx.stroke(); return;
                } else {
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                }
                ctx.fillStyle = this.type === 'antimatter' ? '#333' : this.color; ctx.fill();
                ctx.strokeStyle = this.type === 'antimatter' ? 'purple' : '#555'; ctx.lineWidth = 2; ctx.stroke();
            }
        }

        class Shape {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type; this.angle = Math.random() * Math.PI * 2; this.spin = (Math.random() - 0.5) * 0.02;
                this.markedForDeletion = false; this.team = 'neutral';
                if (this.type === 'square') { this.radius = 15; this.color = '#ffe869'; this.sides = 4; this.maxHp = 10; this.xpValue = 15; }
                else if (this.type === 'triangle') { this.radius = 18; this.color = '#fc7677'; this.sides = 3; this.maxHp = 30; this.xpValue = 40; }
                else if (this.type === 'pentagon') { this.radius = 25; this.color = '#768dfc'; this.sides = 5; this.maxHp = 100; this.xpValue = 150; }
                this.hp = this.maxHp;
            }
            update() {
                this.angle += this.spin;
                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.beginPath();
                for (let i=0; i<this.sides; i++) {
                    const a = (i*2*Math.PI)/this.sides; ctx[i===0?'moveTo':'lineTo'](Math.cos(a)*this.radius, Math.sin(a)*this.radius);
                }
                ctx.closePath(); ctx.fillStyle = this.color; ctx.fill(); ctx.strokeStyle = '#555'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
                drawHealthBar(ctx, this.x, this.y, this.hp, this.maxHp, -this.radius - 15);
            }
        }

        class Tank {
            constructor(x, y, team) {
                this.x = x; this.y = y; this.team = team; this.color = team === 'blue' ? '#00b2e1' : '#f14e54';
                this.radius = 20; this.angle = 0; this.markedForDeletion = false;
                this.classType = 'Base'; this.cooldowns = []; this.alpha = 1; this.orbitAngle = 0; this.abilityCooldown = 0;
                this.level = 1; this.xp = 0; this.nextLevelXp = EVOLUTION_LEVELS[1] || 50; this.skillPoints = 0;
                this.statLevels = [0, 0, 0, 0, 0, 0]; this.maxStatLevel = 7; this.supernovaUsed = false;
                this.hp = this.maxHp;
            }

            get config() { return TANK_CLASSES[this.classType]; }
            get hpRegen() { return 0.02 + (this.statLevels[0] * 0.05); }
            get maxHp() { return (100 + (this.statLevels[1] * 30)) * (this.config.maxHpMult || 1); }
            get bSpeed() { return 8 + (this.statLevels[2] * 2); }
            get bDamage() { return 10 + (this.statLevels[3] * 5); }
            get reloadTime() { return Math.max(5, 30 - (this.statLevels[4] * 3)); }
            get moveSpeed() { return (3 + (this.statLevels[5] * 0.5)) * (this.config.speedMult !== undefined ? this.config.speedMult : 1) * (this.config.moveSpeedMult || 1); }

            addXp(amount) {
                this.xp += amount;
                while (this.xp >= this.nextLevelXp) {
                    this.xp -= this.nextLevelXp; this.level++; this.skillPoints++;
                    this.nextLevelXp = EVOLUTION_LEVELS[this.level] || (this.level*200); // Fallback scale
                    this.hp = this.maxHp;
                }
            }

            evolve(newClass) {
                if (TANK_CLASSES[newClass]) {
                    this.classType = newClass;
                    this.cooldowns = new Array(this.config.b.length).fill(0);
                    this.hp = this.maxHp; this.radius = this.classType === 'Cosmic Overseer' ? 80 : this.classType === 'The Monolith' ? 50 : 20;
                }
            }

            upgradeStat(index) {
                if (this.skillPoints > 0 && this.statLevels[index] < this.maxStatLevel) {
                    this.statLevels[index]++; this.skillPoints--;
                    if (index === 1) this.hp += 30 * (this.config.maxHpMult || 1); 
                }
            }

            shoot(game) {
                const barrels = this.config.b;
                if (!barrels) return;
                barrels.forEach((b, i) => {
                    if (this.cooldowns[i] > 0) return;
                    const bAngle = this.angle + (b.a ? b.a * Math.PI/180 : 0);
                    const spread = b.spr ? (Math.random() - 0.5) * b.spr : 0;
                    const finalAngle = bAngle + spread;
                    
                    if (['drone','minion','square_drone','seeker'].includes(b.type)) {
                        if (game.bullets.filter(bl => bl.owner === this && bl.type === b.type).length >= (b.max || 8)) return;
                    }
                    const cx = this.x + Math.cos(this.angle + Math.PI/2) * (b.y || 0) + Math.cos(this.angle) * (b.x || 0);
                    const cy = this.y + Math.sin(this.angle + Math.PI/2) * (b.y || 0) + Math.sin(this.angle) * (b.x || 0);
                    const tipX = cx + Math.cos(bAngle) * (b.l || 35); const tipY = cy + Math.sin(bAngle) * (b.l || 35);

                    game.bullets.push(new Bullet(tipX, tipY, finalAngle, this, b));
                    this.cooldowns[i] = this.reloadTime * (b.r || 1);
                    if (b.rec) { this.x -= Math.cos(bAngle) * b.rec; this.y -= Math.sin(bAngle) * b.rec; }
                });
            }

            useAbility(game, mouseWorldPos) {
                if (this.abilityCooldown > 0) return;
                if (this.config.ability === 'teleport') {
                    game.bullets.push(new Bullet(this.x, this.y, 0, this, {type:'shockwave', d:5}));
                    this.x = mouseWorldPos.x; this.y = mouseWorldPos.y;
                    game.bullets.push(new Bullet(this.x, this.y, 0, this, {type:'shockwave', d:5}));
                    this.abilityCooldown = 60;
                }
                if (this.config.ability === 'orbital') {
                    game.bullets.push(new Bullet(mouseWorldPos.x, mouseWorldPos.y, 0, this, {type:'orbital', d:50}));
                    this.abilityCooldown = 20;
                }
            }

            updateTank(game, isMoving) {
                for(let i=0; i<this.cooldowns.length; i++) if (this.cooldowns[i] > 0) this.cooldowns[i]--;
                if (this.abilityCooldown > 0) this.abilityCooldown--;
                if (this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.hpRegen);

                this.alpha = (this.config.invis && !isMoving) ? Math.max(0.1, this.alpha - 0.02) : 1;

                if (this.config.aura === 'chrono') {
                    [...game.enemies, ...game.bullets, game.player].forEach(e => {
                        if (e && e.team !== this.team && Math.hypot(e.x-this.x, e.y-this.y) < 500) e.slowed = true;
                    });
                }
                if (this.config.aura === 'drain' && game.ticks % 10 === 0) {
                    const viewW = game.canvas.width/game.camera.zoom, viewH = game.canvas.height/game.camera.zoom;
                    [...game.enemies, ...game.shapes, game.player].forEach(e => {
                        if (e && e.team !== this.team && Math.abs(e.x-this.x)<viewW && Math.abs(e.y-this.y)<viewH) {
                            e.hp -= this.bDamage*0.2; this.hp = Math.min(this.maxHp, this.hp + this.bDamage*0.1);
                        }
                    });
                }
                if (this.config.passive === 'supernova' && this.hp < this.maxHp * 0.2 && !this.supernovaUsed) {
                    this.supernovaUsed = true; game.bullets.push(new Bullet(this.x, this.y, 0, this, {type:'supernova_blast', d:20}));
                }
                if (this.config.passive === 'trail' && isMoving && game.ticks % 10 === 0) {
                    game.bullets.push(new Bullet(this.x, this.y, 0, this, {type:'toxic_trail', d:0.5}));
                }
                if (this.config.passive === 'quasar') {
                    this.angle += 0.02; // Auto spin for Quasar
                }
                if (this.config.tesla && game.ticks % 30 === 0) {
                    [...game.enemies, ...game.shapes, game.player].forEach(e => {
                        if (e && e.team !== this.team && !e.markedForDeletion && Math.hypot(e.x-this.x, e.y-this.y) < 250) {
                            e.hp -= this.bDamage;
                            game.ctx.beginPath(); game.ctx.moveTo(this.x, this.y); game.ctx.lineTo(e.x, e.y);
                            game.ctx.strokeStyle = '#6abcf1'; game.ctx.lineWidth = 3; game.ctx.stroke();
                        }
                    });
                }
                if (this.config.swarm) {
                    this.orbitAngle += 0.05;
                    [...game.enemies, ...game.shapes, game.player].forEach(e => {
                        if (e && e.team !== this.team && Math.hypot(e.x-this.x, e.y-this.y) < 100) e.hp -= 1;
                    });
                }
                if (this.config.autoTurrets && game.ticks % 20 === 0) {
                    for(let t=0; t<this.config.autoTurrets; t++) {
                        let closest = null, dist = 500;
                        [...game.enemies, ...game.shapes, game.player].forEach(e => {
                            if(e && e.team !== this.team) { let d = Math.hypot(e.x-this.x, e.y-this.y); if(d<dist){dist=d;closest=e;} }
                        });
                        if (closest) game.bullets.push(new Bullet(this.x, this.y, Math.atan2(closest.y-this.y, closest.x-this.x) + (Math.random()-0.5)*0.2, this, {type:'basic', s:1.5, d:0.8}));
                    }
                }
            }

            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.globalAlpha = this.alpha;
                
                if (this.classType === 'Cosmic Overseer') {
                    // Draw Eye
                    ctx.rotate(this.angle);
                    ctx.beginPath(); ctx.ellipse(0,0, 80, 40, 0, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
                    ctx.beginPath(); ctx.arc(0,0, 30, 0, Math.PI*2); ctx.fillStyle = this.color; ctx.fill();
                    ctx.beginPath(); ctx.arc(0,0, 15, 0, Math.PI*2); ctx.fillStyle = '#000'; ctx.fill();
                } else if (this.classType === 'The Monolith') {
                    ctx.beginPath(); ctx.rect(-50,-50,100,100); ctx.fillStyle = '#333'; ctx.fill(); ctx.lineWidth=5; ctx.strokeStyle=this.color; ctx.stroke();
                } else {
                    if(this.config.b) this.config.b.forEach(b => {
                        ctx.save(); ctx.rotate(this.angle); ctx.translate(b.x||0, b.y||0); ctx.rotate((b.a||0)*Math.PI/180);
                        ctx.fillStyle = '#999'; ctx.strokeStyle = '#555'; ctx.lineWidth = 3;
                        ctx.fillRect(0, -(b.w||18)/2, (b.l||35), (b.w||18)); ctx.strokeRect(0, -(b.w||18)/2, (b.l||35), (b.w||18));
                        ctx.restore();
                    });
                    if (this.config.swarm) {
                        for(let i=0; i<3; i++) {
                            const sx = Math.cos(this.orbitAngle+(i*Math.PI*2/3))*80, sy = Math.sin(this.orbitAngle+(i*Math.PI*2/3))*80;
                            ctx.beginPath(); ctx.arc(sx, sy, 10, 0, Math.PI*2); ctx.fillStyle=this.color; ctx.fill(); ctx.stroke();
                        }
                    }
                    if (this.config.aura) {
                        ctx.beginPath(); ctx.arc(0,0, this.config.aura==='chrono'?500:300, 0, Math.PI*2);
                        ctx.fillStyle = this.config.aura==='chrono' ? 'rgba(100,200,255,0.1)' : 'rgba(255,50,50,0.1)'; ctx.fill();
                    }
                    ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fillStyle = this.color; ctx.fill(); ctx.strokeStyle = '#555'; ctx.lineWidth = 3; ctx.stroke();
                }
                ctx.restore();
                if(this.alpha > 0.5) drawHealthBar(ctx, this.x, this.y, this.hp, this.maxHp, this.radius + 15, this.radius*2);
            }
        }

        class Player extends Tank {
            constructor(x, y) { super(x, y, 'blue'); }
            update(keys, mouseWorldPos, game) {
                let dx = 0, dy = 0;
                let speedMult = this.slowed ? 0.1 : 1; this.slowed = false;
                
                if (keys['KeyW']) dy -= 1; if (keys['KeyS']) dy += 1;
                if (keys['KeyA']) dx -= 1; if (keys['KeyD']) dx += 1;
                if (dx !== 0 && dy !== 0) { const l = Math.hypot(dx, dy); dx /= l; dy /= l; }

                this.x += dx * this.moveSpeed * speedMult; this.y += dy * this.moveSpeed * speedMult;
                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));

                if(this.config.passive !== 'quasar') this.angle = Math.atan2(mouseWorldPos.y - this.y, mouseWorldPos.x - this.x);

                if (keys['Space']) this.useAbility(game, mouseWorldPos);
                
                this.updateTank(game, dx !== 0 || dy !== 0);
                
                if (game.isShooting) {
                    if (this.config.ability === 'orbital') this.useAbility(game, mouseWorldPos);
                    else this.shoot(game);
                }
            }
        }

        class EnemyTank extends Tank {
            constructor(x, y, team) {
                super(x, y, team);
                this.wanderTimer = 0; this.target = null;
                // Force spawn as random high-tier for cosmic chaos
                this.level = Math.floor(Math.random() * 200) + 20; 
                let availableTier = 1;
                for(let i=1; i<EVOLUTION_LEVELS.length; i++) if (this.level >= EVOLUTION_LEVELS[i]) availableTier = i+1;
                
                const possibleClasses = getTierClasses(Math.min(availableTier, 20)); // Up to T20 enemies!
                this.evolve(randItem(possibleClasses));
                for(let i=0; i<42; i++) this.upgradeStat(Math.floor(Math.random()*6));
                this.hp = this.maxHp; this.xpValue = 1000 + (this.level * 200);
            }

            update(game) {
                let speedMult = this.slowed ? 0.1 : 1; this.slowed = false;
                let closestDist = 1500; this.target = null;
                
                // Aggressive AABB checking for targets
                const viewR = 1500;
                const check = (entities) => {
                    for (let e of entities) {
                        if (e.team === this.team || e.markedForDeletion) continue;
                        if (Math.abs(e.x-this.x) > viewR || Math.abs(e.y-this.y) > viewR) continue;
                        const dist = Math.hypot(e.x - this.x, e.y - this.y);
                        if (dist < closestDist) { closestDist = dist; this.target = e; }
                    }
                };
                check(game.enemies); check([game.player]);

                let isMoving = false;
                if (this.target) {
                    const dx = this.target.x - this.x, dy = this.target.y - this.y;
                    if(this.config.passive !== 'quasar') this.angle = Math.atan2(dy, dx);
                    let spd = this.moveSpeed * speedMult;
                    if (closestDist < 400) spd = -spd * 0.5; else if (closestDist < 700) spd = 0;
                    this.x += Math.cos(this.angle) * spd; this.y += Math.sin(this.angle) * spd;
                    if(this.config.ability === 'orbital' && Math.random()<0.02) this.useAbility(game, this.target);
                    else this.shoot(game);
                    isMoving = spd !== 0;
                } else {
                    this.wanderTimer--;
                    if (this.wanderTimer <= 0) { this.angle = Math.random() * Math.PI * 2; this.wanderTimer = 60 + Math.random() * 120; }
                    this.x += Math.cos(this.angle) * this.moveSpeed * speedMult; this.y += Math.sin(this.angle) * this.moveSpeed * speedMult;
                    isMoving = true;
                }

                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));
                this.updateTank(game, isMoving);
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas'); this.ctx = this.canvas.getContext('2d', {alpha: false});
                this.keys = {}; this.mouseX = 0; this.mouseY = 0; this.isShooting = false;
                this.camera = { x: MAP_WIDTH/2, y: MAP_HEIGHT/2, zoom: 1 }; this.state = 'PLAYING'; this.ticks = 0;
                this.setupInputs(); this.resize(); window.addEventListener('resize', () => this.resize());
                this.reset(); requestAnimationFrame(() => this.loop());
            }

            reset() {
                this.player = new Player(MAP_WIDTH / 2, MAP_HEIGHT / 2);
                this.bullets = []; this.shapes = []; this.enemies = []; this.state = 'PLAYING';
                for (let i = 0; i < 400; i++) this.shapes.push(new Shape(Math.random()*MAP_WIDTH, Math.random()*MAP_HEIGHT, randItem(['square','triangle','pentagon'])));
                for (let i = 0; i < 30; i++) this.enemies.push(new EnemyTank(Math.random()*MAP_WIDTH, Math.random()*MAP_HEIGHT, Math.random()>0.5?'red':'blue'));
            }

            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }

            setupInputs() {
                window.addEventListener('keydown', e => {
                    this.keys[e.code] = true;
                    if (this.state === 'PLAYING' && this.player.skillPoints > 0 && e.key >= '1' && e.key <= '6') this.player.upgradeStat(parseInt(e.key)-1);
                });
                window.addEventListener('keyup', e => this.keys[e.code] = false);
                window.addEventListener('mousemove', e => { this.mouseX = e.clientX; this.mouseY = e.clientY; });
                window.addEventListener('mousedown', e => {
                    if (e.button === 0) {
                        if (this.state === 'GAMEOVER') this.reset();
                        else if (this.activeEvolutions && this.activeEvolutions.length > 0) {
                            const boxW = 150, boxH = 40, startX = this.canvas.width/2 - (this.activeEvolutions.length*boxW)/2;
                            this.activeEvolutions.forEach((ev, i) => {
                                const bx = startX + i*boxW;
                                if(this.mouseX >= bx && this.mouseX <= bx+boxW-10 && this.mouseY >= 80 && this.mouseY <= 120) this.player.evolve(ev);
                            });
                        } else this.isShooting = true;
                    }
                });
                window.addEventListener('mouseup', e => { if(e.button===0) this.isShooting = false; });
            }

            getMouseWorldPos() { return { x: (this.mouseX - this.canvas.width/2) / this.camera.zoom + this.camera.x, y: (this.mouseY - this.canvas.height/2) / this.camera.zoom + this.camera.y }; }

            handlePhysics(e1, e2, dmg) {
                const dx = Math.abs(e1.x - e2.x), dy = Math.abs(e1.y - e2.y), maxR = e1.radius + e2.radius;
                if (dx > maxR || dy > maxR) return; // AABB Optimization!
                
                const dist = Math.hypot(dx, dy);
                if (dist < maxR) {
                    if (e1.team !== e2.team) {
                        e1.hp -= dmg; e2.hp -= dmg;
                        if (e1.hp<=0 && e2.addXp && e1.xpValue) e2.addXp(e1.xpValue);
                        if (e2.hp<=0 && e1.addXp && e2.xpValue) e1.addXp(e2.xpValue);
                    }
                    if (e1.hp<=0) e1.markedForDeletion = true; if (e2.hp<=0) e2.markedForDeletion = true;
                    if (dist > 0 && e1.classType !== 'The Monolith' && e2.classType !== 'The Monolith') {
                        const pushX = ((e1.x-e2.x)/dist)*(maxR-dist)*0.5;
                        const pushY = ((e1.y-e2.y)/dist)*(maxR-dist)*0.5;
                        e1.x += pushX; e1.y += pushY; e2.x -= pushX; e2.y -= pushY;
                    }
                }
            }

            update() {
                if (this.state === 'GAMEOVER') return;
                this.ticks++;

                this.player.update(this.keys, this.getMouseWorldPos(), this);
                if (this.player.hp <= 0) this.state = 'GAMEOVER';

                // Smooth Camera
                const targetZoom = 1 / (this.player.config.fov || 1);
                this.camera.zoom += (targetZoom - this.camera.zoom) * 0.05;
                this.camera.x += (this.player.x - this.camera.x) * 0.1;
                this.camera.y += (this.player.y - this.camera.y) * 0.1;

                this.bullets.forEach(b => b.update(this));
                this.shapes.forEach(s => s.update());
                this.enemies.forEach(e => e.update(this));

                // AABB Optimized Collisions
                const all = [this.player, ...this.enemies, ...this.shapes].filter(e => !e.markedForDeletion);
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    if (b.life > 40 && b.type === 'orbital') continue; // Warning phase, no damage

                    for (let j = 0; j < all.length; j++) {
                        const e = all[j];
                        if (b.team === e.team) continue;
                        
                        // AABB check avoids hypot lag
                        if (Math.abs(b.x - e.x) > b.radius + e.radius || Math.abs(b.y - e.y) > b.radius + e.radius) continue;
                        
                        if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                            const dmg = Math.min(b.hp, e.hp);
                            if (['laser','railgun','supernova_blast','shockwave','orbital'].includes(b.type)) { e.hp -= b.damage; } // Piercing
                            else { e.hp -= b.damage; b.hp -= dmg; }

                            if (e.hp <= 0) {
                                e.markedForDeletion = true;
                                if (b.owner && b.owner.addXp && e.xpValue) b.owner.addXp(e.xpValue);
                                if (b.owner.classType === 'Necromancer' && e instanceof Shape && e.type === 'square') {
                                   this.bullets.push(new Bullet(e.x, e.y, 0, b.owner, {type:'square_drone', d:2, s:1.5}));
                                }
                            }
                            if (b.hp <= 0 && b.type !== 'laser') { b.markedForDeletion = true; break; }
                        }
                    }
                }
                
                for (let i=0; i<all.length; i++) for (let j=i+1; j<all.length; j++) this.handlePhysics(all[i], all[j], 2);

                this.bullets = this.bullets.filter(b => !b.markedForDeletion);
                this.shapes = this.shapes.filter(s => !s.markedForDeletion);
                this.enemies = this.enemies.filter(e => !e.markedForDeletion);

                if (this.shapes.length < 300) this.shapes.push(new Shape(Math.random()*MAP_WIDTH, Math.random()*MAP_HEIGHT, randItem(['square','triangle','pentagon'])));
                if (this.enemies.length < 35) this.enemies.push(new EnemyTank(Math.random()*MAP_WIDTH, Math.random()*MAP_HEIGHT, Math.random()>0.5?'red':'blue'));
            }

            drawUI() {
                const bw = this.canvas.width * 0.5, bh = 20, bx = (this.canvas.width - bw) / 2, by = this.canvas.height - 30;
                this.ctx.fillStyle = '#222'; this.ctx.fillRect(bx, by, bw, bh);
                this.ctx.fillStyle = '#ffd700'; this.ctx.fillRect(bx, by, bw * (this.player.xp / this.player.nextLevelXp), bh);
                this.ctx.strokeStyle = '#000'; this.ctx.strokeRect(bx, by, bw, bh);
                this.ctx.fillStyle = '#fff'; this.ctx.font = 'bold 14px sans-serif'; this.ctx.textAlign = 'center';
                this.ctx.fillText(`Level ${this.player.level} - ${this.player.classType}`, this.canvas.width / 2, by + 15);

                const sx = 20, sy = this.canvas.height - 250;
                if (this.player.skillPoints > 0) {
                    this.ctx.textAlign = 'left'; this.ctx.fillStyle = '#fff'; this.ctx.font = 'bold 18px sans-serif';
                    this.ctx.fillText(`x${this.player.skillPoints} Upgrades Available!`, sx, sy - 15);
                }
                for (let i = 0; i < 6; i++) {
                    const lvl = this.player.statLevels[i], y = sy + (i * 35);
                    this.ctx.textAlign = 'left'; this.ctx.font = 'bold 14px sans-serif';
                    this.ctx.fillStyle = this.player.skillPoints > 0 && lvl < this.player.maxStatLevel ? '#fff' : '#888';
                    this.ctx.fillText(`[${i + 1}] ${STAT_NAMES[i]}`, sx, y + 16);
                    for (let p = 0; p < this.player.maxStatLevel; p++) {
                        this.ctx.fillStyle = p < lvl ? STAT_COLORS[i] : '#444';
                        this.ctx.fillRect(sx + 140 + (p * 15), y + 5, 12, 14);
                    }
                }

                if (this.player.config.ability) {
                    this.ctx.fillStyle = this.player.abilityCooldown <= 0 ? '#6abcf1' : '#555';
                    this.ctx.font = 'bold 16px sans-serif'; this.ctx.textAlign = 'right';
                    this.ctx.fillText(`[SPACE] Ability Ready`, this.canvas.width - 20, this.canvas.height - 20);
                }

                // Evolution UI
                let currentTierIdx = this.player.config.tier;
                if (currentTierIdx < EVOLUTION_LEVELS.length && this.player.level >= EVOLUTION_LEVELS[currentTierIdx]) {
                    this.activeEvolutions = getTierClasses(currentTierIdx + 1);
                    if (this.activeEvolutions.length > 0) {
                        this.ctx.fillStyle = 'rgba(0,0,0,0.8)'; this.ctx.fillRect(0, 0, this.canvas.width, 150);
                        this.ctx.textAlign = 'center'; this.ctx.fillStyle = '#fff'; this.ctx.font = 'bold 24px sans-serif';
                        this.ctx.fillText(`Evolution Available! (Tier ${currentTierIdx + 1})`, this.canvas.width/2, 40);
                        
                        const boxW = 150, boxH = 40, startX = this.canvas.width/2 - (this.activeEvolutions.length*boxW)/2;
                        this.ctx.font = 'bold 14px sans-serif';
                        this.activeEvolutions.forEach((ev, i) => {
                            const bx = startX + i*boxW;
                            this.ctx.fillStyle = '#6abcf1'; this.ctx.fillRect(bx, 80, boxW-10, boxH);
                            this.ctx.fillStyle = '#fff'; this.ctx.fillText(ev, bx + (boxW-10)/2, 105);
                        });
                    }
                } else this.activeEvolutions = null;
            }

            draw() {
                this.ctx.fillStyle = '#0b0b1a'; this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.save();
                this.ctx.translate(this.canvas.width/2, this.canvas.height/2);
                this.ctx.scale(this.camera.zoom, this.camera.zoom);
                this.ctx.translate(-this.camera.x, -this.camera.y);

                // Grid optimizations
                this.ctx.strokeStyle = 'rgba(255,255,255,0.05)'; this.ctx.lineWidth = 2; this.ctx.beginPath();
                const viewW = this.canvas.width / this.camera.zoom, viewH = this.canvas.height / this.camera.zoom;
                const startX = Math.max(0, Math.floor((this.camera.x - viewW/2)/GRID_SIZE)*GRID_SIZE);
                const startY = Math.max(0, Math.floor((this.camera.y - viewH/2)/GRID_SIZE)*GRID_SIZE);
                const endX = Math.min(MAP_WIDTH, startX + viewW + GRID_SIZE*2);
                const endY = Math.min(MAP_HEIGHT, startY + viewH + GRID_SIZE*2);
                for (let x = startX; x <= endX; x += GRID_SIZE) { this.ctx.moveTo(x, startY); this.ctx.lineTo(x, endY); }
                for (let y = startY; y <= endY; y += GRID_SIZE) { this.ctx.moveTo(startX, y); this.ctx.lineTo(endX, y); }
                this.ctx.stroke();
                
                this.ctx.strokeStyle = '#555'; this.ctx.lineWidth = 10; this.ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

                // Draw order matters
                this.shapes.forEach(s => s.draw(this.ctx));
                this.enemies.forEach(e => e.draw(this.ctx));
                this.bullets.forEach(b => { if (b.type !== 'orbital') b.draw(this.ctx); });
                if (this.state === 'PLAYING') this.player.draw(this.ctx);
                
                // Draw orbitals last so they appear over everything
                this.bullets.forEach(b => { if (b.type === 'orbital') b.draw(this.ctx); });

                this.ctx.restore();

                if (this.state === 'PLAYING') this.drawUI();
                else {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.fillStyle = '#fff'; this.ctx.textAlign = 'center'; this.ctx.font = 'bold 60px sans-serif';
                    this.ctx.fillText('COSMIC COLLAPSE', this.canvas.width / 2, this.canvas.height / 2 - 20);
                    this.ctx.font = '24px sans-serif'; this.ctx.fillText(`Class: ${this.player.classType} (Lv.${this.player.level})`, this.canvas.width/2, this.canvas.height/2 + 20);
                    this.ctx.fillText('Click to restart', this.canvas.width / 2, this.canvas.height / 2 + 60);
                }
            }

            loop() { this.update(); this.draw(); requestAnimationFrame(() => this.loop()); }
        }

        window.onload = () => new Game();
    </script>
</body>
</html>
