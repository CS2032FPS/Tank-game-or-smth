<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Arena Game - Step 2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        // --- CONSTANTS ---
        const MAP_WIDTH = 3000;
        const MAP_HEIGHT = 3000;
        const GRID_SIZE = 50;

        // --- UTILITIES ---
        function drawHealthBar(ctx, x, y, hp, maxHp, yOffset) {
            if (hp >= maxHp) return; // Hide if full health
            const width = 40;
            const height = 6;
            const barX = x - width / 2;
            const barY = y + yOffset;

            ctx.fillStyle = '#555';
            ctx.fillRect(barX, barY, width, height);
            
            const healthWidth = Math.max(0, width * (hp / maxHp));
            ctx.fillStyle = '#85e37d'; // Green health
            ctx.fillRect(barX, barY, healthWidth, height);
            
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, width, height);
        }

        // --- CLASSES ---
        class Bullet {
            constructor(x, y, angle, owner, color) {
                this.x = x;
                this.y = y;
                this.speed = 10;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.radius = 8;
                this.life = 100; // Lifespan (frames)
                this.markedForDeletion = false;
                
                this.owner = owner; // 'player' or 'enemy'
                this.color = color;
                
                this.hp = 10;
                this.damage = 10; 
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                if (this.life <= 0 || 
                    this.x < 0 || this.x > MAP_WIDTH || 
                    this.y < 0 || this.y > MAP_HEIGHT) {
                    this.markedForDeletion = true;
                }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        class Shape {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'square', 'triangle', 'pentagon'
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.02;
                this.markedForDeletion = false;
                
                if (this.type === 'square') {
                    this.radius = 15;
                    this.color = '#ffe869';
                    this.sides = 4;
                    this.maxHp = 10;
                } else if (this.type === 'triangle') {
                    this.radius = 18;
                    this.color = '#fc7677';
                    this.sides = 3;
                    this.maxHp = 30;
                } else if (this.type === 'pentagon') {
                    this.radius = 25;
                    this.color = '#768dfc';
                    this.sides = 5;
                    this.maxHp = 100;
                }
                
                this.hp = this.maxHp;
            }

            update() {
                this.angle += this.spin;
                
                // Boundaries (bounce)
                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.beginPath();
                for (let i = 0; i < this.sides; i++) {
                    const angle = (i * 2 * Math.PI) / this.sides;
                    const px = Math.cos(angle) * this.radius;
                    const py = Math.sin(angle) * this.radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.restore();

                drawHealthBar(ctx, this.x, this.y, this.hp, this.maxHp, -this.radius - 15);
            }
        }

        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 20;
                this.speed = 4;
                this.angle = 0;
                this.barrelLength = 35;
                this.barrelWidth = 18;
                
                this.shootCooldown = 0;
                this.shootDelay = 15; 
                
                this.maxHp = 100;
                this.hp = this.maxHp;
                this.hpRegen = 0.05; // HP gained per frame
            }

            update(keys, mouseWorldPos, game) {
                // Movement
                let dx = 0;
                let dy = 0;
                if (keys['KeyW']) dy -= 1;
                if (keys['KeyS']) dy += 1;
                if (keys['KeyA']) dx -= 1;
                if (keys['KeyD']) dx += 1;

                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length;
                    dy /= length;
                }

                this.x += dx * this.speed;
                this.y += dy * this.speed;

                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));

                // Aiming
                this.angle = Math.atan2(mouseWorldPos.y - this.y, mouseWorldPos.x - this.x);

                // Shooting
                if (this.shootCooldown > 0) this.shootCooldown--;
                if (game.isShooting && this.shootCooldown <= 0) {
                    this.shoot(game);
                    this.shootCooldown = this.shootDelay;
                }

                // Regen
                if (this.hp < this.maxHp) {
                    this.hp = Math.min(this.maxHp, this.hp + this.hpRegen);
                }
            }

            shoot(game) {
                const tipX = this.x + Math.cos(this.angle) * this.barrelLength;
                const tipY = this.y + Math.sin(this.angle) * this.barrelLength;
                game.bullets.push(new Bullet(tipX, tipY, this.angle, 'player', '#00b2e1'));
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Barrel
                ctx.rotate(this.angle);
                ctx.fillStyle = '#999';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.fillRect(0, -this.barrelWidth / 2, this.barrelLength, this.barrelWidth);
                ctx.strokeRect(0, -this.barrelWidth / 2, this.barrelLength, this.barrelWidth);
                ctx.rotate(-this.angle); 

                // Body
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00b2e1';
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.restore();

                drawHealthBar(ctx, this.x, this.y, this.hp, this.maxHp, this.radius + 15);
            }
        }

        class EnemyTank {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 20;
                this.speed = 2.5;
                this.angle = Math.random() * Math.PI * 2;
                this.barrelLength = 35;
                this.barrelWidth = 18;
                
                this.shootCooldown = 0;
                this.shootDelay = 40; 
                
                this.maxHp = 100;
                this.hp = this.maxHp;
                
                this.wanderTimer = 0;
                this.markedForDeletion = false;
            }

            update(game) {
                const player = game.player;
                const dx = player.x - this.x;
                const dy = player.y - this.y;
                const distToPlayer = Math.sqrt(dx * dx + dy * dy);

                let moveSpeed = this.speed;

                if (distToPlayer < 700) {
                    // Aggro Player
                    this.angle = Math.atan2(dy, dx);
                    
                    // Stop approaching if too close
                    if (distToPlayer < 300) {
                        moveSpeed = 0;
                    }

                    // Shoot
                    if (this.shootCooldown <= 0) {
                        const tipX = this.x + Math.cos(this.angle) * this.barrelLength;
                        const tipY = this.y + Math.sin(this.angle) * this.barrelLength;
                        game.bullets.push(new Bullet(tipX, tipY, this.angle, 'enemy', '#f14e54'));
                        this.shootCooldown = this.shootDelay;
                    }
                } else {
                    // Wander Randomly
                    this.wanderTimer--;
                    if (this.wanderTimer <= 0) {
                        this.angle = Math.random() * Math.PI * 2;
                        this.wanderTimer = 60 + Math.random() * 120;
                    }
                }

                if (this.shootCooldown > 0) this.shootCooldown--;

                this.x += Math.cos(this.angle) * moveSpeed;
                this.y += Math.sin(this.angle) * moveSpeed;

                // Map Boundaries
                this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Barrel
                ctx.rotate(this.angle);
                ctx.fillStyle = '#999';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.fillRect(0, -this.barrelWidth / 2, this.barrelLength, this.barrelWidth);
                ctx.strokeRect(0, -this.barrelWidth / 2, this.barrelLength, this.barrelWidth);
                ctx.rotate(-this.angle);

                // Body
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f14e54'; // Red enemy
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.restore();

                drawHealthBar(ctx, this.x, this.y, this.hp, this.maxHp, -this.radius - 15);
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.keys = {};
                this.mouseX = 0;
                this.mouseY = 0;
                this.isShooting = false;
                
                this.camera = { x: 0, y: 0 };
                this.state = 'PLAYING'; // 'PLAYING' or 'GAMEOVER'

                this.setupInputs();
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                this.reset();
                requestAnimationFrame(() => this.loop());
            }

            reset() {
                this.player = new Player(MAP_WIDTH / 2, MAP_HEIGHT / 2);
                this.bullets = [];
                this.shapes = [];
                this.enemies = [];
                this.state = 'PLAYING';
                
                this.spawnInitialEntities();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            setupInputs() {
                window.addEventListener('keydown', e => this.keys[e.code] = true);
                window.addEventListener('keyup', e => this.keys[e.code] = false);
                
                window.addEventListener('mousemove', e => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });
                
                window.addEventListener('mousedown', e => {
                    if (e.button === 0) {
                        if (this.state === 'GAMEOVER') this.reset();
                        else this.isShooting = true;
                    }
                });
                window.addEventListener('mouseup', e => {
                    if (e.button === 0) this.isShooting = false;
                });
            }

            spawnInitialEntities() {
                const types = ['square', 'triangle', 'pentagon'];
                for (let i = 0; i < 150; i++) {
                    this.shapes.push(new Shape(Math.random() * MAP_WIDTH, Math.random() * MAP_HEIGHT, types[Math.floor(Math.random() * types.length)]));
                }
                for (let i = 0; i < 15; i++) {
                    this.enemies.push(new EnemyTank(Math.random() * MAP_WIDTH, Math.random() * MAP_HEIGHT));
                }
            }

            getMouseWorldPos() {
                return {
                    x: this.mouseX + this.camera.x,
                    y: this.mouseY + this.camera.y
                };
            }

            // Handles overlap resolution and body damage between two circular entities
            handlePhysicalCollision(e1, e2, damageRatio) {
                const dx = e1.x - e2.x;
                const dy = e1.y - e2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const minDist = e1.radius + e2.radius;

                if (dist < minDist) {
                    // Deal body damage
                    e1.hp -= damageRatio;
                    e2.hp -= damageRatio;

                    if (e1.hp <= 0) e1.markedForDeletion = true;
                    if (e2.hp <= 0) e2.markedForDeletion = true;

                    // Push apart to prevent getting stuck
                    if (dist > 0) {
                        const overlap = minDist - dist;
                        const pushX = (dx / dist) * overlap * 0.5;
                        const pushY = (dy / dist) * overlap * 0.5;
                        
                        e1.x += pushX; e1.y += pushY;
                        e2.x -= pushX; e2.y -= pushY;
                    }
                }
            }

            checkCollisions() {
                // 1. Bullets vs Shapes, Player, and Enemies
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    
                    // vs Shapes
                    for (let j = this.shapes.length - 1; j >= 0; j--) {
                        const s = this.shapes[j];
                        const dist = Math.hypot(b.x - s.x, b.y - s.y);
                        if (dist < b.radius + s.radius) {
                            let dmg = Math.min(b.hp, s.hp);
                            s.hp -= b.damage;
                            b.hp -= dmg;
                            if (s.hp <= 0) s.markedForDeletion = true;
                            if (b.hp <= 0) { b.markedForDeletion = true; break; }
                        }
                    }

                    if (b.markedForDeletion) continue;

                    // vs Player (if enemy bullet)
                    if (b.owner === 'enemy') {
                        const dist = Math.hypot(b.x - this.player.x, b.y - this.player.y);
                        if (dist < b.radius + this.player.radius) {
                            this.player.hp -= b.damage;
                            b.markedForDeletion = true;
                        }
                    } 
                    // vs Enemies (if player bullet)
                    else if (b.owner === 'player') {
                        for (let j = this.enemies.length - 1; j >= 0; j--) {
                            const e = this.enemies[j];
                            const dist = Math.hypot(b.x - e.x, b.y - e.y);
                            if (dist < b.radius + e.radius) {
                                e.hp -= b.damage;
                                b.markedForDeletion = true;
                                if (e.hp <= 0) e.markedForDeletion = true;
                                break;
                            }
                        }
                    }
                }

                // 2. Physical/Body Collisions
                // Player vs Shapes
                this.shapes.forEach(s => this.handlePhysicalCollision(this.player, s, 1));
                
                // Player vs Enemies
                this.enemies.forEach(e => this.handlePhysicalCollision(this.player, e, 0.5));
                
                // Enemies vs Shapes
                this.enemies.forEach(e => {
                    this.shapes.forEach(s => this.handlePhysicalCollision(e, s, 0.5));
                });
            }

            update() {
                if (this.state === 'GAMEOVER') return;

                this.player.update(this.keys, this.getMouseWorldPos(), this);

                if (this.player.hp <= 0) {
                    this.state = 'GAMEOVER';
                }

                // Update Camera to follow player
                this.camera.x = this.player.x - this.canvas.width / 2;
                this.camera.y = this.player.y - this.canvas.height / 2;

                // Clamp camera
                this.camera.x = Math.max(0, Math.min(MAP_WIDTH - this.canvas.width, this.camera.x));
                this.camera.y = Math.max(0, Math.min(MAP_HEIGHT - this.canvas.height, this.camera.y));

                this.bullets.forEach(b => b.update());
                this.shapes.forEach(s => s.update());
                this.enemies.forEach(e => e.update(this));

                this.checkCollisions();

                // Cleanup deleted entities
                this.bullets = this.bullets.filter(b => !b.markedForDeletion);
                this.shapes = this.shapes.filter(s => !s.markedForDeletion);
                this.enemies = this.enemies.filter(e => !e.markedForDeletion);

                // Respawn
                if (this.shapes.length < 100) {
                    const types = ['square', 'triangle', 'pentagon'];
                    this.shapes.push(new Shape(Math.random() * MAP_WIDTH, Math.random() * MAP_HEIGHT, types[Math.floor(Math.random() * types.length)]));
                }
                if (this.enemies.length < 10) {
                    this.enemies.push(new EnemyTank(Math.random() * MAP_WIDTH, Math.random() * MAP_HEIGHT));
                }
            }

            drawGrid() {
                this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                
                const startX = Math.floor(this.camera.x / GRID_SIZE) * GRID_SIZE;
                const startY = Math.floor(this.camera.y / GRID_SIZE) * GRID_SIZE;
                const endX = startX + this.canvas.width + GRID_SIZE;
                const endY = startY + this.canvas.height + GRID_SIZE;

                for (let x = startX; x <= endX; x += GRID_SIZE) {
                    this.ctx.moveTo(x, this.camera.y);
                    this.ctx.lineTo(x, this.camera.y + this.canvas.height);
                }
                for (let y = startY; y <= endY; y += GRID_SIZE) {
                    this.ctx.moveTo(this.camera.x, y);
                    this.ctx.lineTo(this.camera.x + this.canvas.width, y);
                }
                this.ctx.stroke();
            }

            draw() {
                // Clear screen
                this.ctx.fillStyle = '#cdcdcd';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.save();
                this.ctx.translate(-this.camera.x, -this.camera.y);

                this.drawGrid();
                
                // Draw Arena Bounds
                this.ctx.strokeStyle = '#333';
                this.ctx.lineWidth = 5;
                this.ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

                // Draw Entities
                this.shapes.forEach(s => s.draw(this.ctx));
                this.enemies.forEach(e => e.draw(this.ctx));
                this.bullets.forEach(b => b.draw(this.ctx));
                
                if (this.state === 'PLAYING') {
                    this.player.draw(this.ctx);
                }

                this.ctx.restore();

                // UI Overlay
                if (this.state === 'GAMEOVER') {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    this.ctx.fillStyle = '#fff';
                    this.ctx.textAlign = 'center';
                    
                    this.ctx.font = 'bold 60px sans-serif';
                    this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2 - 20);
                    
                    this.ctx.font = '24px sans-serif';
                    this.ctx.fillText('Click anywhere to restart', this.canvas.width / 2, this.canvas.height / 2 + 30);
                }
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        window.onload = () => {
            new Game();
        };

    </script>
</body>
</html>
